<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | Style Saloon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#fafafa] text-[#2c2c2c] pb-24 md:pb-0">

    <!-- Header -->
    <header class="sticky top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <button onclick="toggleMobileMenu(true)" class="md:hidden p-2 text-gray-600 hover:text-[#ff6b35] transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <a href="index.html" class="flex-shrink-0 flex items-center cursor-pointer">
                    <span class="text-xl md:text-2xl font-bold text-[#ff6b35]">Style Saloon</span>
                </a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-sm font-semibold transition-colors">Home</a>
                    <a href="services.html" class="text-sm font-semibold transition-colors">Services</a>
                    <a href="pricing.html" class="text-sm font-semibold transition-colors">Pricing</a>
                    <a href="contact.html" class="text-sm font-semibold transition-colors">Contact</a>
                </nav>
                <div class="hidden md:flex items-center space-x-6">
                    <button onclick="toggleCart(true)" class="relative p-2 text-gray-600 hover:text-[#ff6b35] transition-colors">
                        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        <span class="cart-badge absolute top-0 right-0 bg-[#ff6b35] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] flex items-center justify-center border-2 border-white hidden">0</span>
                    </button>
                    <div class="auth-container"></div>
                    <button onclick="window.location.href='services.html'" class="bg-[#ff6b35] text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-[#e85a2a] shadow-lg shadow-[#ff6b35]/20 transition-all">Book Now</button>
                </div>
                <div class="md:hidden flex items-center space-x-2">
                    <button onclick="toggleCart(true)" class="relative p-2 text-gray-600 hover:text-[#ff6b35] transition-colors">
                        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        <span class="cart-badge absolute top-0 right-0 bg-[#ff6b35] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] flex items-center justify-center border-2 border-white hidden">0</span>
                    </button>
                    <div class="auth-container"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Drawer Menu -->
    <div id="menu-backdrop" class="fixed inset-0 bg-black/50 z-[100] backdrop-blur-sm hidden" onclick="toggleMobileMenu(false)"></div>
    <div id="mobile-menu" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out z-[101] flex flex-col">
        <div class="p-6 bg-gradient-to-br from-[#fff5f0] to-white border-b border-gray-100">
            <div class="flex items-center justify-between mb-8">
                <span class="text-xl font-bold text-[#ff6b35]">Style Saloon</span>
                <button onclick="toggleMobileMenu(false)" class="p-2 text-gray-400 hover:text-[#ff6b35] transition-colors bg-white rounded-full shadow-sm">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="mobile-profile-section"></div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
            <a href="index.html" class="flex items-center justify-between p-4 rounded-2xl transition-all hover:bg-gray-50 group">
                <div class="flex items-center space-x-4">
                    <i data-lucide="home" class="w-5 h-5 text-gray-400 group-hover:text-[#ff6b35]"></i>
                    <span class="font-bold">Home</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="services.html" class="flex items-center justify-between p-4 rounded-2xl transition-all hover:bg-gray-50 group">
                <div class="flex items-center space-x-4">
                    <i data-lucide="scissors" class="w-5 h-5 text-gray-400 group-hover:text-[#ff6b35]"></i>
                    <span class="font-bold">Services</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="pricing.html" class="flex items-center justify-between p-4 rounded-2xl transition-all hover:bg-gray-50 group">
                <div class="flex items-center space-x-4">
                    <i data-lucide="dollar-sign" class="w-5 h-5 text-gray-400 group-hover:text-[#ff6b35]"></i>
                    <span class="font-bold">Pricing</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
            <a href="contact.html" class="flex items-center justify-between p-4 rounded-2xl transition-all hover:bg-gray-50 group">
                <div class="flex items-center space-x-4">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-400 group-hover:text-[#ff6b35]"></i>
                    <span class="font-bold">Contact</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
            </a>
        </nav>
        <div class="p-6 border-t border-gray-100 bg-gray-50">
            <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 p-4 bg-red-50 text-red-600 hover:bg-red-100 transition-colors rounded-2xl font-bold">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div id="cart-backdrop" class="fixed inset-0 bg-black/50 z-[100] backdrop-blur-sm hidden" onclick="toggleCart(false)"></div>
    <div id="cart-slider" class="fixed inset-y-0 right-0 w-full max-md bg-white h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out z-[101]">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i data-lucide="shopping-cart" class="w-6 h-6 text-[#ff6b35]"></i>
                <h2 class="text-xl font-bold text-[#2c2c2c]">Your Cart</h2>
            </div>
            <button onclick="toggleCart(false)" class="p-2 hover:bg-gray-100 rounded-full">
                <i data-lucide="x" class="w-6 h-6 text-gray-400"></i>
            </button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6"></div>
        <div class="p-6 border-t border-gray-100 space-y-4">
            <div class="flex items-center justify-between text-lg">
                <span class="font-medium text-gray-600">Subtotal</span>
                <span id="cart-subtotal" class="font-bold text-[#2c2c2c]">₹0</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="clearCart()" class="border-2 border-gray-100 text-gray-600 py-3.5 rounded-2xl font-bold hover:bg-gray-50 transition-colors">Clear All</button>
                <button onclick="toggleCheckoutModal(true)" class="bg-[#ff6b35] text-white py-3.5 rounded-2xl font-bold hover:bg-[#e85a2a] shadow-lg shadow-[#ff6b35]/20 transition-all">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Hybrid Mobile Bottom Navigation -->
    <div class="md:hidden fixed bottom-6 left-4 right-4 bg-white rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] z-40 px-2 py-3 border border-gray-100">
        <div class="flex items-center justify-between relative w-full">
            <div class="flex items-center justify-around w-[40%]">
                <a href="index.html" class="bottom-nav-item flex items-center space-x-1.5 px-3 py-1.5 rounded-full transition-all text-gray-400">
                    <i data-lucide="home" class="w-6 h-6"></i>
                    <span class="bottom-nav-label text-[12px] font-bold hidden">Home</span>
                </a>
                <a href="services.html" class="bottom-nav-item flex items-center space-x-1.5 px-3 py-1.5 rounded-full transition-all text-gray-400">
                    <i data-lucide="scissors" class="w-6 h-6"></i>
                    <span class="bottom-nav-label text-[12px] font-bold hidden">Services</span>
                </a>
            </div>
            <div class="absolute left-1/2 -top-10 transform -translate-x-1/2">
                <button onclick="window.location.href='services.html'" class="w-16 h-16 bg-gradient-to-tr from-[#ff6b35] to-[#ff4e00] text-white rounded-full flex items-center justify-center shadow-[0_8px_20px_rgba(255,107,53,0.4)] border-4 border-white transform hover:scale-105 active:scale-95 transition-all">
                    <i data-lucide="calendar" class="w-7 h-7"></i>
                </button>
            </div>
            <div class="flex items-center justify-around w-[40%]">
                <a href="contact.html" class="bottom-nav-item flex items-center space-x-1.5 px-3 py-1.5 rounded-full transition-all text-gray-400">
                    <i data-lucide="message-square" class="w-6 h-6"></i>
                    <span class="bottom-nav-label text-[12px] font-bold hidden">Contact</span>
                </a>
                <a href="profile.html" class="bottom-nav-item flex items-center space-x-1.5 px-3 py-1.5 rounded-full transition-all text-gray-400">
                    <i data-lucide="user" class="w-6 h-6"></i>
                    <span class="bottom-nav-label text-[12px] font-bold hidden">Profile</span>
                </a>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-20">
        <div id="profile-content">
            <!-- Populated by JS -->
            <div class="flex items-center justify-center h-64">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#ff6b35]"></div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-backdrop" class="fixed inset-0 bg-black/50 z-[110] backdrop-blur-sm hidden" onclick="toggleEditProfileModal(false)"></div>
    <div id="edit-profile-modal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white rounded-[40px] shadow-2xl z-[111] hidden overflow-hidden">
        <div class="p-8 border-b border-gray-100 flex items-center justify-between bg-white relative z-10">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-[#ff6b35]/10 rounded-2xl flex items-center justify-center">
                    <i data-lucide="edit-3" class="w-6 h-6 text-[#ff6b35]"></i>
                </div>
                <h2 class="text-2xl font-bold text-[#2c2c2c]">Edit Profile</h2>
            </div>
            <button onclick="toggleEditProfileModal(false)" class="p-2 hover:bg-gray-100 rounded-full">
                <i data-lucide="x" class="w-6 h-6 text-gray-400"></i>
            </button>
        </div>
        <form onsubmit="handleProfileUpdate(event)" class="p-8 space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Full Name</label>
                <input type="text" id="edit-name" required class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Gender</label>
                <select id="edit-gender" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold">
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Occupation</label>
                <input type="text" id="edit-occupation" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold" placeholder="Member">
            </div>
            <button type="submit" class="w-full bg-[#ff6b35] text-white py-5 rounded-[24px] font-bold text-xl hover:bg-[#e85a2a] shadow-2xl shadow-[#ff6b35]/30 transition-all transform hover:scale-[1.02] active:scale-[0.98]">Save Changes</button>
        </form>
    </div>

    <!-- Checkout Modal (Booking Details) -->
    <div id="checkout-backdrop" class="fixed inset-0 bg-black/50 z-[110] backdrop-blur-sm hidden" onclick="toggleCheckoutModal(false)"></div>
    <div id="checkout-modal" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white rounded-[40px] shadow-2xl z-[111] hidden overflow-hidden">
        <div class="p-8 border-b border-gray-100 flex items-center justify-between bg-white relative z-10">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-[#ff6b35]/10 rounded-2xl flex items-center justify-center">
                    <i data-lucide="calendar" class="w-6 h-6 text-[#ff6b35]"></i>
                </div>
                <h2 class="text-2xl font-bold text-[#2c2c2c]">Confirm Booking</h2>
            </div>
            <button onclick="toggleCheckoutModal(false)" class="p-2 hover:bg-gray-100 rounded-full">
                <i data-lucide="x" class="w-6 h-6 text-gray-400"></i>
            </button>
        </div>
        <form onsubmit="handleCheckoutSubmit(event)" class="p-8 space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Full Name</label>
                <input type="text" id="checkout-name" required class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold" placeholder="John Doe">
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Select Date</label>
                    <input type="date" id="checkout-date" required class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Select Time</label>
                    <select id="checkout-time" required class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold">
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                        <option value="06:00 PM">06:00 PM</option>
                    </select>
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Email Address</label>
                <input type="email" id="checkout-email" required class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-transparent focus:bg-white focus:border-[#ff6b35]/30 focus:outline-none transition-all font-bold" placeholder="john@example.com">
            </div>
            <button type="submit" class="w-full bg-[#ff6b35] text-white py-5 rounded-[24px] font-bold text-xl hover:bg-[#e85a2a] shadow-2xl shadow-[#ff6b35]/30 transition-all transform hover:scale-[1.02] active:scale-[0.98]">Confirm Appointment</button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        function renderProfile() {
            const content = document.getElementById('profile-content');
            if (!state.user) {
                window.location.href = 'login.html';
                return;
            }

            const now = new Date();
            const completedBookings = state.bookings.filter(b => {
                const bookingTime = new Date(`${b.date} ${b.time.replace(' AM', ':00 AM').replace(' PM', ':00 PM')}`);
                return bookingTime <= now;
            });

            const visits = completedBookings.length;
            const points = visits * 100 + 450;

            content.innerHTML = `
                <div class="grid lg:grid-cols-3 gap-10">
                    <!-- Profile Card -->
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-[40px] p-10 shadow-sm border border-gray-100 text-center">
                            <div class="relative w-32 h-32 mx-auto mb-6">
                                <div class="w-full h-full rounded-full border-4 border-white shadow-xl overflow-hidden bg-gray-50">
                                    <img src="${state.user.gender === 'Female' ? 'assets/female_avatar.png' : 'assets/male_avatar.png'}" alt="Profile" class="w-full h-full object-cover">
                                </div>
                                <button onclick="toggleEditProfileModal(true)" class="absolute bottom-0 right-0 w-10 h-10 bg-[#ff6b35] text-white rounded-full flex items-center justify-center border-4 border-white shadow-lg transform hover:scale-110 transition-all">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <h2 class="text-3xl font-bold text-[#2c2c2c] mb-1">${state.user.name}</h2>
                            <p class="text-gray-500 font-bold text-sm uppercase tracking-widest mb-8">${state.user.email}</p>
                            
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div class="bg-gray-50 p-4 rounded-3xl">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Visits</p>
                                    <p class="text-2xl font-bold text-[#ff6b35]">${visits}</p>
                                </div>
                                <div class="bg-gray-50 p-4 rounded-3xl">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Points</p>
                                    <p class="text-2xl font-bold text-[#ff6b35]">${points}</p>
                                </div>
                            </div>
                            
                            <button onclick="logout()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-bold hover:bg-red-100 transition-all flex items-center justify-center space-x-2">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                                <span>Logout</span>
                            </button>
                        </div>
                    </div>

                    <!-- Details & History -->
                    <div class="lg:col-span-2 space-y-8">
                        <div class="bg-white rounded-[40px] p-10 shadow-sm border border-gray-100">
                            <h3 class="text-2xl font-bold text-[#2c2c2c] mb-8 flex items-center space-x-3">
                                <i data-lucide="calendar" class="w-6 h-6 text-[#ff6b35]"></i>
                                <span>Recent Appointments</span>
                            </h3>
                            <div class="space-y-6">
                                ${state.bookings.length === 0 ? `
                                    <div class="text-center py-12 bg-gray-50 rounded-[32px] border-2 border-dashed border-gray-200">
                                        <p class="text-gray-500 font-bold uppercase tracking-widest text-xs">No bookings yet</p>
                                        <button onclick="window.location.href='services.html'" class="mt-4 text-[#ff6b35] font-bold hover:underline">Book Your First Session</button>
                                    </div>
                                ` : state.bookings.map(booking => {
                                    const bookingDateTime = new Date(`${booking.date} ${booking.time.replace(' AM', ':00 AM').replace(' PM', ':00 PM')}`);
                                    const isFuture = bookingDateTime > new Date();
                                    const statusText = isFuture ? 'Scheduled' : 'Completed';
                                    const statusClass = isFuture ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600';
                                    
                                    return `
                                    <div class="flex items-center justify-between p-6 rounded-3xl bg-gray-50 border border-gray-100">
                                        <div class="flex items-center space-x-6">
                                            <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm text-[#ff6b35]">
                                                <i data-lucide="scissors" class="w-8 h-8"></i>
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-lg text-[#2c2c2c]">${booking.items.map(i => i.name).join(', ')}</h4>
                                                <p class="text-sm text-gray-500 font-bold uppercase tracking-widest">${booking.date} • ${booking.time}</p>
                                            </div>
                                        </div>
                                        <span class="px-4 py-2 ${statusClass} rounded-full text-xs font-bold uppercase tracking-widest">${statusText}</span>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>

                        <div class="bg-[#ff6b35] rounded-[40px] p-10 text-white relative overflow-hidden shadow-2xl shadow-[#ff6b35]/30">
                            <div class="relative z-10">
                                <h3 class="text-3xl font-bold mb-4">Membership Perks</h3>
                                <p class="text-[#fff]/80 font-medium max-w-md mb-8">You're a ${visits > 5 ? 'Gold' : 'Silver'} Member! Enjoy special discounts and priority booking.</p>
                                <button class="bg-white text-[#ff6b35] px-8 py-4 rounded-2xl font-bold hover:bg-gray-100 transition-all">View All Perks</button>
                            </div>
                            <div class="absolute -right-20 -bottom-20 opacity-10">
                                <i data-lucide="award" class="w-80 h-80"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        }

        function toggleEditProfileModal(show) {
            const modal = document.getElementById('edit-profile-modal');
            const backdrop = document.getElementById('edit-profile-backdrop');
            if (show) {
                document.getElementById('edit-name').value = state.user.name;
                document.getElementById('edit-gender').value = state.user.gender || 'Female';
                document.getElementById('edit-occupation').value = state.user.occupation || '';
                modal.classList.remove('hidden');
                backdrop.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                backdrop.classList.add('hidden');
            }
        }

        function handleProfileUpdate(e) {
            e.preventDefault();
            const updatedData = {
                name: document.getElementById('edit-name').value,
                gender: document.getElementById('edit-gender').value,
                occupation: document.getElementById('edit-occupation').value
            };
            updateProfile(updatedData);
            toggleEditProfileModal(false);
            renderProfile();
        }

        function logout() {
            updateAuth(null);
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProfile();
        });
    </script>
</body>
</html>
